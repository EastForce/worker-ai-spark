name: 已去标识化隐私 / 安全线索（Privacy & Security）
description: 公开报告不含个人信息或利用细节的线索；敏感内容请使用 SECURITY.md 邮箱。
title: "[安全] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## 重要提醒
        - **严重且未修复的漏洞，请不要在公开 Issue 中披露全部细节**；
        - 请联系 SECURITY.md 公布的安全邮箱 workeraiopen@foxmail.com；
        - 本模板不要求你公开任何个人敏感信息；
        - 不要添加截图、照片、日志、原始文件或其他附件；
        - 涉及个人经历、身份信息或未去标识化材料时，不要创建公开 Issue，只使用安全邮箱。
  - type: dropdown
    id: report-type
    attributes:
      label: 报告类型
      options:
        - 隐私泄露（姓名 / 单位 / 联系方式等）
        - 可识别劳动者的信息
        - 恶意代码或不安全脚本
        - 仓库安全配置问题
        - 其他
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: 问题摘要
      description: 说明问题性质与大致位置，**不要在此粘贴未修复漏洞的完整利用细节**。
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 潜在影响
      description: 对劳动者、贡献者或仓库可能造成的影响
    validations:
      required: false
  - type: checkboxes
    id: no-detail
    attributes:
      label: 确认
      options:
        - label: 我未在本 Issue 中披露未修复漏洞的全部技术细节
          required: true
        - label: 我未提交任何个人信息、可识别经历、截图、日志、原始文件或附件
          required: true
