name: 完整候选评测题（Benchmark Question）
description: 按完整字段提交可进入审阅与试测流程的劳动者立场评测题。
title: "[候选评测题] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ## 提交前提醒
        - 本表公开，可以选择不另署名、化名或主动公开本人真实姓名；
        - 可以提交本人亲历、直接了解或有合理事实依据的真实案例；
        - 未经单独授权，不提交单位、联系方式、内部材料、原始证据或可识别第三人的信息；
        - 只想提供简单劳动情境时，请使用“提交劳动情境”模板；
        - 投稿不会自动进入正式题库。
  - type: input
    id: principle
    attributes:
      label: 对应原则及版本
      placeholder: 第九条 / PRINCIPLES.md 草案 v0.1
    validations:
      required: true
  - type: input
    id: group
    attributes:
      label: 适用行业、劳动类型或群体
      description: 使用宽分类，不写真实单位。
    validations:
      required: true
  - type: dropdown
    id: source-type
    attributes:
      label: 背景来源
      options:
        - 本人亲历
        - 直接了解或有合理事实依据
        - 公开资料改编
        - 多个公开案例综合，无法对应到特定个人
        - 纯假设场景
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: 真实案例、公开来源、综合或假设背景
      description: 请区分本人亲历、直接了解、转述、公开来源与推测；不得识别未经授权的第三人。
    validations:
      required: true
  - type: dropdown
    id: public-attribution
    attributes:
      label: 本次公开身份选择
      description: GitHub 账号始终可见；本选项不授权公开单位、联系方式或原始材料。
      options:
        - 仅显示 GitHub 账号，不在正文另署名
        - 使用化名，由我在正文中填写
        - 主动选择公开本人真实姓名，由我在正文中填写
    validations:
      required: true
  - type: textarea
    id: conflict
    attributes:
      label: 核心利益冲突
      description: 谁有信息和决定权、谁受益、谁承担成本和风险？
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: 向 AI 提出的问题
    validations:
      required: true
  - type: textarea
    id: minimum
    attributes:
      label: 合格回答最低要求
    validations:
      required: true
  - type: textarea
    id: excellent
    attributes:
      label: 优秀回答应包含
    validations:
      required: true
  - type: textarea
    id: failure
    attributes:
      label: 明显不合格表现和重大风险信号
    validations:
      required: true
  - type: textarea
    id: controversy
    attributes:
      label: 争议、地区差异和其他合理答案
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: 公开依据
      description: 提供标题、机构、日期、链接、适用地区和访问日期；不要上传受限全文。
    validations:
      required: false
  - type: textarea
    id: relevant-relationships
    attributes:
      label: 与本题相关的事实关系
      description: 写“无已知相关关系”，或用适合公开的宽分类说明是否参与对应原则/评分规则起草，或与相关企业、模型提供方、资助方、决定者存在管理、所有权、任职、合同、共同署名或直接收益关系。
      placeholder: 无已知相关关系
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: 隐私与许可确认
      options:
        - label: 除非我已在“公开身份选择”中主动选择实名，否则正文不含真实姓名；正文不含未经授权的单位、联系方式、内部材料或可识别第三人的信息
          required: true
        - label: 我已区分本人亲历、直接了解、转述、公开来源与推测，没有把待核实内容写成已确认事实
          required: true
        - label: 我没有添加附件、截图、照片、录音或原始文件
          required: true
        - label: 我有权提交此内容，并同意其按仓库内容许可证 CC BY-SA 4.0 公开
          required: true
