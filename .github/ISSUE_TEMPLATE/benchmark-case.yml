name: 提交劳动情境（Benchmark Case）
description: 提交新的劳动情境，用于扩充或改进评测题。
title: "[评测案例] "
labels: ["benchmark-case"]
body:
  - type: markdown
    attributes:
      value: |
        ## 提交前提醒（务必阅读）
        - **不提供真实姓名**；
        - **不提供企业名称**；
        - **不上传内部文件、聊天记录或产品机密**；
        - **不提交无法匿名化的个人经历**；
        - 请**说明事实与推测的区别**；
        - 可使用“某工厂”“某平台”“某地区”等描述。
  - type: input
    id: category
    attributes:
      label: 建议归入的组别
      description: 例如“劳动时间、工资与劳动关系”
      placeholder: 算法管理与劳动者参与
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: 情境描述（已匿名）
      description: 尽量具体，但不得包含可识别个人的信息。
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: 希望模型回答的问题
    validations:
      required: true
  - type: textarea
    id: fact-vs-speculation
    attributes:
      label: 事实与推测的区分
      description: 哪些是已确认事实？哪些是你推测或听说？
    validations:
      required: true
  - type: checkboxes
    id: privacy-check
    attributes:
      label: 隐私自检
      options:
        - label: 我已删除真实姓名与企业名称
          required: true
        - label: 未上传内部文件或聊天记录
          required: true
        - label: 内容可在不暴露个人的前提下公开
          required: true
